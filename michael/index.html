  .foto{width:132px;height:132px;border-radius:50%;object-fit:cover;border:5px solid #fff;margin:-66px auto 0;display:block;position:relative;z-index:2;box-shadow:0 6px 20px rgba(0,0,0,.15)}
  .info{text-align:center;padding:16px 16px 8px}

  .empresa{color:var(--sub);font-size:14px;margin-top:2px}
  .guardar{display:block;margin:20px 16px;padding:16px;background:var(--azul);color:#fff;text-align:center;border-radius:14px;font-weight:600;font-size:17px;text-decoration:none;box-shadow:0 6px 16px rgba(34,64,154,.3)}
  .guardar:active{transform:scale(.98)}
  .acciones{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px}
  .acciones a{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--txt);font-size:12px;font-weight:600}
  .ico{width:52px;height:52px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
  .ico svg{width:24px;height:24px;fill:none;stroke:var(--azul);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  ul{list-style:none;margin:24px 16px;border-top:1px solid #e3e9f3}
  li{display:flex;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid #e3e9f3;font-size:15px}
  li small{display:block;color:var(--sub);font-size:12px}
  li a{color:var(--txt);text-decoration:none;word-break:break-all}
  li svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--celeste);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:8px 16px 28px}
